function sod(d){var x=new Date(d);x.setHours(0,0,0,0);return x}
function pad(n){return String(n).padStart(2,'0')}
function toLocal(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
function subj(id){return S.subjects.find(function(s){return s.id===id})}
function dayDiff(due){return Math.round((sod(due)-sod(new Date()))/864e5)}
function fmtT(d){return pad(d.getHours())+':'+pad(d.getMinutes())}
function dueInfo(t){
  if(!t.due)return {txt:'Без срока',cls:'',g:5};
  var d=new Date(t.due),n=dayDiff(d),dt=d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
  if(t.done)return {txt:dt+', '+fmtT(d),cls:'',g:6};
  if(d<new Date())return {txt:'Просрочено: '+dt+', '+fmtT(d),cls:'bad',g:0};
  if(n===0)return {txt:'Сегодня в '+fmtT(d),cls:'warn',g:1};
  if(n===1)return {txt:'Завтра в '+fmtT(d),cls:'warn',g:2};
  if(n<=7)return {txt:'Через '+pl(n,['день','дня','дней'])+', '+dt,cls:'',g:3};
  return {txt:dt+', '+fmtT(d),cls:'',g:4};
}

async function saveBook(){
  var title=$('bTitle').value.trim();
  if(!title){$('bTitle').focus();toast('Введите название');return}
  if(!bookFile){toast('Выберите PDF-файл');return}
  var btn=document.querySelector('[data-a="saveBook"]');btn.disabled=true;btn.textContent='Загружаю…';
  try{
    var bk=sb.storage.from('homework'),file=bookFile,old=ui.editB?S.books.find(function(x){return x.id===ui.editB}):null;
    if(bookFile.raw){
      var p='books/'+uid()+uid()+'.pdf';
      var up=await bk.upload(p,bookFile.raw,{contentType:'application/pdf',cacheControl:'31536000'});
      if(up.error)throw up.error;
      file={n:bookFile.n,t:'application/pdf',size:bookFile.size,d:bk.getPublicUrl(p).data.publicUrl,p:p};
    }
    var row={title:title,author:$('bAuthor').value.trim(),kind:$('bKind').value,subject_id:$('bSub').value||null,file:file};
    var r=ui.editB?await sb.from('books').update(row).eq('id',ui.editB):await sb.from('books').insert(row);
    if(r.error)throw r.error;
    if(old&&old.file&&old.file.p&&old.file.p!==file.p)await bk.remove([old.file.p]);
    $('dBook').close();await load();render();toast('Сохранено');
  }catch(e){toast('Ошибка: '+(e.message||e))}
  btn.disabled=false;btn.textContent='Сохранить';
}

}

/* ---------- календарь ---------- */
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function renderCal(){
  if(!ui.cal){var n=new Date();ui.cal=new Date(n.getFullYear(),n.getMonth(),1)}
  var m=ui.cal,y=m.getFullYear(),mo=m.getMonth(),off=(new Date(y,mo,1).getDay()+6)%7;
  var cur=ui.sub==='all'?null:subj(ui.sub),by={};
  S.tasks.forEach(function(t){if(!t.due||(cur&&t.sid!==cur.id))return;var k=t.due.slice(0,10);(by[k]=by[k]||[]).push(t)});
  var td=ymd(new Date());
  var open=ui.calOpen===undefined?!matchMedia('(max-width:820px)').matches:ui.calOpen;
  var h='<div class="calw"><div class="ch"><button data-a="cmo" data-id="-1" aria-label="Предыдущий месяц">‹</button><button class="ct" data-a="ctog" aria-expanded="'+open+'">'+m.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})+' '+(open?'▴':'▾')+'</button><button data-a="cmo" data-id="1" aria-label="Следующий месяц">›</button></div>';
  if(!open){$('cal').innerHTML=h+'</div>';return}
  h+='<div class="cg">'+DAYS.map(function(d){return '<div class="wd">'+d+'</div>'}).join('');
  for(var i=0;i<42;i++){
    var d=new Date(y,mo,1-off+i);
    if(i>=35&&d.getMonth()!==mo)break;
    var k=ymd(d),L=(by[k]||[]).slice().sort(function(a,b){return a.done-b.done}).slice(0,4);
    var dots=L.map(function(t){var s=subj(t.sid);return '<i style="--c:'+(s?s.color:'#8a8f98')+(t.done?';opacity:.35':'')+'"></i>'}).join('');
    var cnt=(by[k]||[]).length;
    h+='<button class="cd'+(d.getMonth()!==mo?' o':'')+(k===td?' t':'')+(k===ui.day?' s':'')+'" data-a="day" data-id="'+k+'" aria-label="'+d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})+(cnt?', заданий: '+cnt:'')+'"><span class="n">'+d.getDate()+'</span><span class="dots">'+dots+'</span></button>';
  }
  h+='</div><button class="btn sm" data-a="ctoday" style="width:100%;margin-top:8px">Сегодня</button></div>';
  $('cal').innerHTML=h;
}
function renderDay(){
  var cur=ui.sub==='all'?null:subj(ui.sub),d=new Date(ui.day+'T00:00'),wd=(d.getDay()+6)%7;
  var list=S.tasks.filter(function(t){return t.due&&t.due.slice(0,10)===ui.day&&(!cur||t.sid===cur.id)}).sort(function(a,b){return new Date(a.due)-new Date(b.due)});

/* ---------- ссылки ---------- */
function normUrl(u){
  u=String(u||'').trim();if(!u)return null;
  if(/^(javascript|data|vbscript|file|blob):/i.test(u))return null;
  if(!/^https?:\/\//i.test(u))u='https://'+u;
  try{new URL(u)}catch(e){return null}
  return u;
}
function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}}
function linkMatch(l,q){var s=subj(l.sid);return (l.title+' '+l.desc+' '+l.cat+' '+host(l.url)+' '+(s?s.name:'')).toLowerCase().indexOf(q)>=0}

  }).join('');

function comp(f){
  return new Promise(function(res){
    if(f.type.indexOf('image/')!==0){
      if(f.size>1.5e6){toast('Файл «'+f.name+'» больше 1,5 МБ, он не добавлен');return res(null)}
      var r=new FileReader();r.onload=function(){res({n:f.name,t:f.type||'application/octet-stream',d:r.result})};r.onerror=function(){res(null)};r.readAsDataURL(f);return;
    }
    var im=new Image(),u=URL.createObjectURL(f);
    im.onload=function(){
      var m=1100,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(u);res({n:f.name||'фото.jpg',t:'image/jpeg',d:c.toDataURL('image/jpeg',.72)});
    };
    im.onerror=function(){toast('Не удалось открыть «'+f.name+'». Попробуйте JPG или PNG.');res(null)};
    im.src=u;
  });
}

  try{
    var out=[],bk=sb.storage.from('homework');
    for(var i=0;i<files.length;i++){
      var f=files[i];

        var blob=await (await fetch(f.d)).blob();

        var p=uid()+uid()+'.'+ext;
        var up=await bk.upload(p,blob,{contentType:f.t,cacheControl:'31536000'});
        if(up.error)throw up.error;

  render();
  if($('dData').open&&amode!=='reset')drawAcc();
}
async function refresh(){await load();render()}
/* ---------- события ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.dataset.a,id=el.dataset.id,t;
  if(a==='none')return;
  if(a==='editTask'&&!ADMIN){openView(id);return}
  if(a==='toggleV'){t=S.tasks.find(function(x){return x.id===id});t.done=!t.done;if(t.done)DONE[id]=1;else delete DONE[id];saveDone();$('dView').close();render();return}
  if(!ADMIN&&/^(newTask|editTask|newSub|editSub|saveTask|saveSub|delTask|delSub|newBook|editBook|saveBook|delBook|addLes|rmLes|newLink|editLink|saveLink|delLink|newTeach|editTeach|saveTeach|delTeach|addCons|rmCons|tsub)$/.test(a))return;
  if(a==='sub'){ui.sub=id;ui.q='';$('q').value='';render()}
  else if(a==='tab'){ui.tab=id;render()}
  else if(a==='cmo'){ui.cal=new Date(ui.cal.getFullYear(),ui.cal.getMonth()+(+id),1);renderCal()}
  else if(a==='ctog'){ui.calOpen=!(ui.calOpen===undefined?!matchMedia('(max-width:820px)').matches:ui.calOpen);renderCal()}
  else if(a==='day'){if(matchMedia('(max-width:820px)').matches)ui.calOpen=false;ui.day=ui.day===id?'':id;ui.tab='tasks';ui.q='';$('q').value='';render()}
  else if(a==='ctoday'){if(matchMedia('(max-width:820px)').matches)ui.calOpen=false;ui.cal=null;ui.day=ymd(new Date());ui.tab='tasks';ui.q='';$('q').value='';render()}
  else if(a==='dayoff'){ui.day='';render()}
  else if(a==='newLink')openLink();
  else if(a==='editLink')openLink(id);
  else if(a==='saveLink')saveLink();
  else if(a==='delLink')delLink(el);
  else if(a==='newTeach')openTeach();
  else if(a==='editTeach')openTeach(id,el.dataset.n);
  else if(a==='saveTeach')saveTeach();
  else if(a==='delTeach')delTeach(el);
  else if(a==='tsub'){var ix=tsel.indexOf(id);if(ix<0)tsel.push(id);else tsel.splice(ix,1);drawPills()}
  else if(a==='addCons'){cons.push({type:'Консультация',when:'all',day:'',from:'',to:'',weeks:'',date:'',room:'',note:''});drawCons()}
  else if(a==='rmCons'){cons.splice(+el.dataset.i,1);drawCons()}
  else if(a==='addLes'){les.push({type:'Лекция',day:0,from:'08:30',to:'10:05',week:'all',teacher:'',room:''});drawLes()}
  else if(a==='rmLes'){les.splice(+el.dataset.i,1);drawLes()}
  else if(a==='newBook')openBook();
  else if(a==='editBook')openBook(id);
  else if(a==='saveBook')saveBook();
  else if(a==='delBook')delBook(el);
  else if(a==='pickBook')$('bFile').click();
  else if(a==='flt'){ui.flt=id;render()}
  else if(a==='newTask')openTask();
  else if(a==='editTask')openTask(id);
  else if(a==='newSub')openSub();
  else if(a==='editSub')openSub(id);
  else if(a==='saveTask')saveTask();
  else if(a==='saveSub')saveSub();
  else if(a==='color'){pickC=id;drawSw()}
  else if(a==='close')$(el.dataset.t).close();
  else if(a==='toggle'){t=S.tasks.find(function(x){return x.id===id});t.done=!t.done;if(t.done)DONE[id]=1;else delete DONE[id];saveDone();render()}
  else if(a==='q'){var i=$('tDue');if(id==='x')i.value='';else{var d=new Date();d.setDate(d.getDate()+(+id));d.setHours(23,59,0,0);i.value=toLocal(d)}}
  else if(a==='pick')$('tFile').click();
  else if(a==='rmF'){files.splice(+el.dataset.i,1);drawAtt()}
  else if(a==='zoom'){t=S.tasks.find(function(x){return x.id===id});$('lbi').src=t.files[+el.dataset.i].d;$('lb').showModal()}
  else if(a==='zoomF'){$('lbi').src=files[+el.dataset.i].d;$('lb').showModal()}
  else if(a==='delTask')delTask(el);
  else if(a==='delSub')delSub(el);
  else if(a==='theme'){var r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dk?'light':'dark';setTC()}
  else if(a==='auth'){if(sb){if(!USER&&amode==='reset')amode='in';accOpen()}}
  else if(a==='amode'){amode=id;drawAcc()}
  else if(a==='doin')doIn();
  else if(a==='doup')doUp();
  else if(a==='dosetpw')doSetPw();
  else if(a==='chpw'){amode='reset';drawAcc()}
  else if(a==='admreset')admReset();
  else if(a==='logout'){sb.auth.signOut();$('dData').close()}
  else if(a==='delacc'){
    if(!armed){armed=true;el.textContent='Точно удалить аккаунт и данные?';return}
    armed=false;
    sb.rpc('delete_my_account').then(function(r){if(r.error){toast('Не удалось удалить: '+r.error.message);return}sb.auth.signOut();$('dData').close();toast('Аккаунт удалён')});
  }
});
document.addEventListener('change',function(e){
  if(e.target.id==='tFile'){addFiles(e.target.files);e.target.value=''}
  if(e.target.id==='bFile'){
    var f=e.target.files[0];e.target.value='';if(!f)return;
    if(!(f.type==='application/pdf'||/\.pdf$/i.test(f.name))){toast('Нужен файл PDF');return}
    if(f.size>50*1048576){toast('Файл больше 50 МБ, его не принимает бесплатный тариф');return}
    bookFile={n:f.name,t:'application/pdf',size:f.size,raw:f};drawBookFile();
    if(!$('bTitle').value.trim())$('bTitle').value=f.name.replace(/\.pdf$/i,'');
  }
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.l){var l=les[+el.dataset.i];if(l)l[el.dataset.l]=el.dataset.l==='day'?+el.value:el.value}
  else if(el.dataset&&el.dataset.c!==undefined){var cc=cons[+el.dataset.i];if(cc){cc[el.dataset.c]=el.value;if(el.dataset.c==='when')drawCons()}}
  else if(el.id==='tSub'){var tt=$('tTeach');if(tt)tt.innerHTML=teacherOpts(el.value,'')}
  else if(el.id==='vNote'){if(el.value.trim())NOTES[ui.viewId]=el.value;else delete NOTES[ui.viewId];saveDone()}
  else if(el.id==='q'){ui.q=el.value;render()}
  else if(el.id==='cpick'){pickC=el.value;[].forEach.call(document.querySelectorAll('#sw button'),function(b){b.classList.remove('on')});el.parentNode.classList.add('on')}
});
document.addEventListener('paste',function(e){var f=[].filter.call((e.clipboardData||{}).files||[],function(x){return x.type.indexOf('image/')===0});if(f.length)addFiles(f)});
document.addEventListener('dragover',function(e){var d=$('drop');if(d&&d.contains(e.target)){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',function(e){var d=$('drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',function(e){var d=$('drop');if(d&&d.contains(e.target)){e.preventDefault();d.classList.remove('over');addFiles(e.dataTransfer.files)}});
['dTask','dSub','dBook','dLink','dTeach','dView','dData','lb'].forEach(function(i){$(i).addEventListener('click',function(e){if(e.target===this)this.close()})});
try{var cs0=JSON.parse(localStorage.getItem('uchyoba-cache'));if(cs0&&cs0.subjects){S={subjects:cs0.subjects,tasks:cs0.tasks||[],books:cs0.books||[],links:cs0.links||[],teachers:cs0.teachers||[]};S.tasks.forEach(function(t){t.done=!!DONE[t.id]});LOADING=false}}catch(e){}
render();
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&/^(aNick|aPass)$/.test(e.target.id)){e.preventDefault();submitAuth()}});
$('dView').addEventListener('close',function(){render()});
if(sb)sb.auth.onAuthStateChange(function(ev,sess){
  if(ev==='TOKEN_REFRESHED'){USER=sess?sess.user:USER;return}
  USER=sess?sess.user:null;
  if(ev==='SIGNED_OUT'){DONE={};NOTES={};ADMIN=false;try{localStorage.removeItem('uchyoba-done')}catch(e){}}
  if(ev==='PASSWORD_RECOVERY')amode='reset';
  setTimeout(function(){afterAuth().then(function(){if(ev==='PASSWORD_RECOVERY')accOpen('reset')})},0);
});
var tg=window.Telegram&&window.Telegram.WebApp;
if(tg&&tg.initData){
  tg.ready();tg.expand();
  if(tg.colorScheme)document.documentElement.dataset.theme=tg.colorScheme;
  try{tg.setHeaderColor('secondary_bg_color')}catch(e){}
  document.addEventListener('click',function(e){var l=e.target.closest('a[href^="http"]');if(l){e.preventDefault();tg.openLink(l.href)}});
}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(function(){});
refresh();
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!document.querySelector('dialog[open]'))refresh()});
setInterval(function(){if(!document.hidden&&!document.querySelector('dialog[open]'))refresh()},300000);
})();
</script>
