function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},3200)}
function pl(n,f){var a=Math.abs(n)%100,b=a%10;return n+' '+(a>10&&a<20?f[2]:b>1&&b<5?f[1]:b==1?f[0]:f[2])}
function sod(d){var x=new Date(d);x.setHours(0,0,0,0);return x}
function pad(n){return String(n).padStart(2,'0')}
function toLocal(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
function subj(id){return S.subjects.find(function(s){return s.id===id})}
function dayDiff(due){return Math.round((sod(due)-sod(new Date()))/864e5)}
function fmtT(d){return pad(d.getHours())+':'+pad(d.getMinutes())}
function dueInfo(t){
  if(!t.due)return {txt:'Без срока',cls:'',g:5};
  var d=new Date(t.due),n=dayDiff(d),dt=d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
  if(t.done)return {txt:dt+', '+fmtT(d),cls:'',g:6};
  if(d<new Date())return {txt:'Просрочено: '+dt+', '+fmtT(d),cls:'bad',g:0};
  if(n===0)return {txt:'Сегодня в '+fmtT(d),cls:'warn',g:1};
  if(n===1)return {txt:'Завтра в '+fmtT(d),cls:'warn',g:2};
  var toSun=6-(new Date().getDay()+6)%7,tx='Через '+pl(n,['день','дня','дней'])+', '+dt;
  if(n<=toSun)return {txt:tx,cls:'',g:3};
  if(n<=toSun+7)return {txt:tx,cls:'',g:3.5};
  return {txt:dt+', '+fmtT(d),cls:'',g:4};
}

}

function kv(k,v){return '<div><small>'+k+'</small>'+(v?esc(v):'<span style="color:var(--mut)">не указано</span>')+'</div>'}
function dueShort(t){
  if(t.done)return {t:'Сдано',p:'var(--ok)'};
  if(!t.due)return {t:'Без срока',p:'var(--mut)'};
  var d=new Date(t.due),n=dayDiff(d);
  if(d<new Date())return {t:'Просрочено',p:'var(--bad)'};
  if(n===0)return {t:'Сегодня, '+fmtT(d),p:'var(--warn)'};
  if(n===1)return {t:'Завтра, '+fmtT(d),p:'var(--warn)'};
  return {t:d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'}).replace('.',''),p:'var(--mut)'};
}

function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function renderCal(){
  if(!OPTS.cal){$('cal').innerHTML='';return}
  var mob=matchMedia('(max-width:820px)').matches;
  var open=ui.calOpen===undefined?!mob:ui.calOpen,week=!open,now=new Date();

    for(var i=0;i<7;i++)days.push(new Date(b.getFullYear(),b.getMonth(),b.getDate()+i));
    title=days[3];
  }else{
    var m=ui.cal,y=m.getFullYear(),mo=m.getMonth(),off=(new Date(y,mo,1).getDay()+6)%7;

  var evBy={};S.events.forEach(function(e){if(!e.start||(cur&&e.sid&&e.sid!==cur.id))return;var k=e.start.slice(0,10);(evBy[k]=evBy[k]||[]).push(e)});
  var td=ymd(now),nav=week?'cwk':'cmo';

    var cnt=(by[k]||[]).length;

  });
  h+='</div>'+((open||ui.wk)?'<button class="btn sm" data-a="ctoday" style="width:100%;margin-top:8px">Сегодня</button>':'')+'</div>';
  $('cal').innerHTML=h;

function normUrl(u){
  u=String(u||'').trim();if(!u)return null;
  if(/^(javascript|data|vbscript|file|blob):/i.test(u))return null;
  if(!/^https?:\/\//i.test(u))u='https://'+u;
  try{new URL(u)}catch(e){return null}
  return u;
}

function linkMatch(l,q){var s=subj(l.sid);return (l.title+' '+l.desc+' '+l.cat+' '+host(l.url)+' '+(s?s.name:'')).toLowerCase().indexOf(q)>=0}

var TEACHER_GRADES={};
try{TEACHER_GRADES=JSON.parse(localStorage.getItem('uchyoba-teacher-grades')||'{}')||{}}catch(e){TEACHER_GRADES={}}
function gradeKey(name){return nk(name)}
function parseGradeLines(text){
  return String(text||'').split(/\n/).map(function(line){
    var m=line.trim().match(/^(\d+(?:[.,]\d+)?)\s*(?:-|–|—|:)\s*(.+)$/);
    if(!m)return null;
    var pts=Number(m[1].replace(',','.')),grade=m[2].trim();
    if(!Number.isFinite(pts)||pts<0||!grade)return null;
    return {points:pts,grade:grade};
  }).filter(Boolean).sort(function(a,b){return a.points-b.points});
}
function gradeText(rows){return (rows||[]).map(function(x){return x.points+' - '+x.grade}).join('\n')}
function saveTeacherGrades(name,text){
  var key=gradeKey(name),rows=parseGradeLines(text);
  if(rows.length)TEACHER_GRADES[key]=rows;else delete TEACHER_GRADES[key];
  try{localStorage.setItem('uchyoba-teacher-grades',JSON.stringify(TEACHER_GRADES))}catch(e){}
}
function teacherGradeBlock(name){
  var rows=TEACHER_GRADES[gradeKey(name)]||[];
  return '<div class="gradebox"><div class="gradehead">Разбалловка</div>'+(rows.length?'<div class="graderows">'+rows.map(function(x){return '<span class="gradeitem">'+esc(x.points)+' баллов <b>→ '+esc(x.grade)+'</b></span>'}).join('')+'</div>':'<div class="gradeempty">Не указана</div>')+'</div>';

async function doBackup(){
  aerr('');amsgs('');
  try{
    var out={app:'neti-planner',version:1,exported_at:new Date().toISOString(),tables:{}},n=0;
    for(var i=0;i<BK_TABLES.length;i++){
      var r=await sb.from(BK_TABLES[i]).select('*');

      out.tables[BK_TABLES[i]]=r.data;n+=r.data.length;
    }
    var u=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'})),a=document.createElement('a');
    a.href=u;a.download='neti-backup-'+ymd(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1500);
    amsgs('Копия скачана, записей: '+n);
  }catch(e){aerr('Ошибка: '+(e.message||e))}
}

function mapErr(m){

  if(/already|registered/i.test(m))return 'Этот ник уже занят';
  if(/rate|limit|too many/i.test(m))return 'Слишком много попыток, попробуйте чуть позже.';
  if(/fetch|network/i.test(m))return 'Нет связи с сервером. Откройте сайт по обычной ссылке.';
  if(/email/i.test(m)&&/invalid/i.test(m))return 'Сервер не принял служебный адрес. Сообщите администратору.';
  if(/password/i.test(m)&&/short|least|weak/i.test(m))return 'Пароль слишком простой или короткий.';
  return m;
}

  else if(a==='acctool'){armed=false;ui.accView='t:'+id;drawAcc();$('dDataB').scrollTop=0;if(id==='admins'&&OWNER)loadAdmins()}
  else if(a==='install'){
    if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(function(){deferredPrompt=null;updInstall()})}
    else installHelp();
  }
  else if(a==='insthide'){try{localStorage.setItem('uchyoba-inst-hide',String(Date.now()))}catch(e){}updInstall()}
  else if(a==='arcgo')doArchive();
  else if(a==='arcpurge'){if(!armed){armed=true;el.textContent='Точно удалить навсегда?';return}armed=false;doPurge()}
  else if(a==='arcfiles'){if(!armed){armed=true;el.textContent='Точно удалить файлы?';return}armed=false;doStripFiles()}
  else if(a==='addadm'){
    aerr('');amsgs('');var nk2=($('aNick3').value||'').trim();if(!nk2){aerr('Введите ник');return}
    sb.rpc('add_admin',{p_nick:nk2}).then(function(r){if(r.error){aerr(/not found/i.test(r.error.message)?'Такого ника нет. Пусть студент сначала зарегистрируется.':r.error.message);return}loadAdmins().then(function(){amsgs('Администратор добавлен')})});
  }
  else if(a==='rmadm'){
    if(!armed){armed=true;el.textContent='Точно убрать?';return}
    armed=false;
    sb.rpc('remove_admin',{p_user_id:id}).then(function(r){if(r.error){aerr(r.error.message);return}loadAdmins().then(function(){amsgs('Права сняты')})});
  }
  else if(a==='bkdl')doBackup();
  else if(a==='bkpick')$('bkFile').click();
  else if(a==='bkgo'){if(!armed){armed=true;el.textContent='Точно заменить данные из копии?';return}armed=false;doRestore()}
  else if(a==='soon'){$('dData').close();if(el.dataset.k==='task')openView(id);else openEvView(id)}
  else if(a==='evf'){ui.evf=id;ui.fx='casc';render()}
  else if(a==='tsub'){var ix=tsel.indexOf(id);if(ix<0)tsel.push(id);else tsel.splice(ix,1);drawPills()}
  else if(a==='addCons'){cons.push({type:'Консультация',when:'all',day:'',from:'',to:'',weeks:'',date:'',room:'',note:''});drawCons()}
  else if(a==='rmCons'){cons.splice(+el.dataset.i,1);drawCons()}
  else if(a==='addLes'){les.push({type:'Лекция',day:0,from:'08:30',to:'10:05',week:'all',teacher:'',room:''});drawLes()}
  else if(a==='rmLes'){les.splice(+el.dataset.i,1);drawLes()}
  else if(a==='newBook')openBook();
  else if(a==='editBook')openBook(id);
  else if(a==='saveBook')saveBook();
  else if(a==='delBook')delBook(el);
  else if(a==='pickBook')$('bFile').click();
  else if(a==='flt'){ui.flt=id;ui.fx='casc';render()}
  else if(a==='newTask')openTask();
  else if(a==='editTask')openTask(id);
  else if(a==='newSub'){if($('dDisc').open)$('dDisc').close();openSub()}
  else if(a==='editSub')openSub(id);
  else if(a==='saveTask')saveTask();
  else if(a==='saveSub')saveSub();
  else if(a==='color'){pickC=id;drawSw()}
  else if(a==='close')$(el.dataset.t).close();
  else if(a==='toggle'){
    t=S.tasks.find(function(x){return x.id===id});
    t.done=!t.done;if(t.done)DONE[id]=1;else delete DONE[id];saveDone();
    var card=el.closest('.task');clearTimeout(ui.tmT);
    if(t.done&&card&&!reduced()){
      el.innerHTML='<svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 7.5l3 3 7-7" stroke="#fff" stroke-width="2" fill="none"/></svg>';
      card.classList.add('fx-done');ui.tmT=setTimeout(render,560);
    }else render();
  }
  else if(a==='q'){var i=$('tDue');if(id==='x')i.value='';else{var d=new Date();d.setDate(d.getDate()+(+id));d.setHours(23,59,0,0);i.value=toLocal(d)}}
  else if(a==='pick')$('tFile').click();
  else if(a==='rmF'){files.splice(+el.dataset.i,1);drawAtt()}
  else if(a==='zoom'){t=S.tasks.find(function(x){return x.id===id});$('lbi').src=t.files[+el.dataset.i].d;$('lb').showModal()}
  else if(a==='zoomF'){$('lbi').src=files[+el.dataset.i].d;$('lb').showModal()}
  else if(a==='delTask')delTask(el);
  else if(a==='delSub')delSub(el);
  else if(a==='theme'){var r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dk?'light':'dark';try{localStorage.setItem('uchyoba-theme',r.dataset.theme)}catch(e){}if(USER){PROFILE.theme=r.dataset.theme;saveDone()}setTC()}
  else if(a==='auth'){if(sb){if(!USER&&amode==='reset')amode='in';accOpen()}}
  else if(a==='amode'){amode=id;drawAcc()}
  else if(a==='doin')doIn();
  else if(a==='doup')doUp();
  else if(a==='dosetpw')doSetPw();
  else if(a==='chpw'){amode='reset';drawAcc()}
  else if(a==='admreset')admReset();
  else if(a==='logout'){sb.auth.signOut();$('dData').close()}
  else if(a==='delacc'){
    if(!armed){armed=true;el.textContent='Точно удалить аккаунт и данные?';return}
    armed=false;
    sb.rpc('delete_my_account').then(function(r){if(r.error){toast('Не удалось удалить: '+r.error.message);return}sb.auth.signOut();$('dData').close();toast('Аккаунт удалён')});
  }
});
document.addEventListener('change',function(e){
  if(e.target.id==='tFile'){addFiles(e.target.files);e.target.value=''}
  if(e.target.id==='bkFile'){
    var bf=e.target.files[0];e.target.value='';if(!bf)return;
    var rd=new FileReader();
    rd.onload=function(){try{var o=JSON.parse(rd.result);if(o.app!=='neti-planner'||!o.tables)throw 0;var n=0;Object.keys(o.tables).forEach(function(k){n+=(o.tables[k]||[]).length});ui.bk=o.tables;ui.bkn=n;drawAcc();amsgs('Файл от '+(o.exported_at||'').slice(0,10)+' готов. Нажмите «Восстановить», чтобы применить.')}catch(x){toast('Файл не похож на копию данных сайта')}};
    rd.readAsText(bf);
  }
  if(e.target.id==='avFile'){processAvatar(e.target.files[0]);e.target.value=''}
  if(e.target.id==='eFile'){addEvFiles(e.target.files);e.target.value=''}
  if(e.target.id==='bFile'){
    var f=e.target.files[0];e.target.value='';if(!f)return;
    if(!(f.type==='application/pdf'||/\.pdf$/i.test(f.name))){toast('Нужен файл PDF');return}
    if(f.size>50*1048576){toast('Файл больше 50 МБ, его не принимает бесплатный тариф');return}
    bookFile={n:f.name,t:'application/pdf',size:f.size,raw:f};drawBookFile();
    if(!$('bTitle').value.trim())$('bTitle').value=f.name.replace(/\.pdf$/i,'');
  }
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.l){var l=les[+el.dataset.i];if(l)l[el.dataset.l]=el.dataset.l==='day'?+el.value:el.value}
  else if(el.dataset&&el.dataset.opt){OPTS[el.dataset.opt]=el.checked;PROFILE.opts=Object.assign({},OPTS);try{localStorage.setItem('uchyoba-opts',JSON.stringify(OPTS))}catch(e){}saveDone();render();if($('dData').open&&/^t:/.test(ui.accView||''))drawAcc()}
  else if(el.dataset&&el.dataset.c!==undefined){var cc=cons[+el.dataset.i];if(cc){cc[el.dataset.c]=el.value;if(el.dataset.c==='when')drawCons()}}
  else if(el.id==='tSub'){var tt=$('tTeach');if(tt)tt.innerHTML=teacherOpts(el.value,'')}
  else if(el.id==='aaDate'||el.id==='apDate'){updArcCounts()}
  else if(/^[te]PubMode$/.test(el.id)){var pw=$(el.id.charAt(0)+'PubWrap');if(pw)pw.style.display=el.value==='sched'?'':'none'}
  else if(el.id==='vNote'){if(el.value.trim())NOTES[ui.viewId]=el.value;else delete NOTES[ui.viewId];saveDone()}
  else if(el.id==='q'){ui.q=el.value;render()}
  else if(el.id==='cpick'){pickC=el.value;[].forEach.call(document.querySelectorAll('#sw button'),function(b){b.classList.remove('on')});el.parentNode.classList.add('on')}
});
document.addEventListener('toggle',function(e){if(e.target.id==='acSet')ui.setOpen=e.target.open},true);
window.addEventListener('hashchange',openHash);
try{matchMedia('(max-width:820px)').addEventListener('change',function(){render()})}catch(e){}
document.addEventListener('input',function(e){var i=e.target&&e.target.id;if(i==='tMatQ')drawMatList();else if(i==='dnQ'){ui.dnQ=e.target.value;var L=$('dnL');if(L)L.innerHTML=dnList()}});
document.addEventListener('paste',function(e){var f=[].filter.call((e.clipboardData||{}).files||[],function(x){return x.type.indexOf('image/')===0});if(f.length){if($('dEv').open)addEvFiles(f);else addFiles(f)}});
document.addEventListener('dragover',function(e){var d=$('drop');if(d&&d.contains(e.target)){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',function(e){var d=$('drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',function(e){var d=$('drop');if(d&&d.contains(e.target)){e.preventDefault();d.classList.remove('over');addFiles(e.dataTransfer.files)}});
['dTask','dSub','dBook','dLink','dTeach','dEv','dDisc','dView','dData','lb'].forEach(function(i){$(i).addEventListener('click',function(e){if(e.target===this)this.close()})});
try{var o0=JSON.parse(localStorage.getItem('uchyoba-opts'));if(o0)OPTS=Object.assign({},DEF_OPTS,o0)}catch(e){}
try{var fs0=localStorage.getItem('uchyoba-fs');if(fs0)document.documentElement.dataset.fs=fs0}catch(e){}
try{var th0=localStorage.getItem('uchyoba-theme');if(th0==='light'||th0==='dark')document.documentElement.dataset.theme=th0}catch(e){}
try{var cs0=JSON.parse(localStorage.getItem('uchyoba-cache'));if(cs0&&cs0.subjects){S={subjects:cs0.subjects,tasks:cs0.tasks||[],books:cs0.books||[],links:cs0.links||[],teachers:cs0.teachers||[],events:cs0.events||[],trash:[],cfg:cs0.cfg||{}};S.tasks.forEach(function(t){t.done=!!DONE[t.id]});LOADING=false}}catch(e){}
render();
(function(){var pend=0,app=document.querySelector('.app');refreshAuthBtn();decorate();new MutationObserver(function(){if(!pend)pend=requestAnimationFrame(function(){pend=0;decorate()})}).observe(app,{childList:true,subtree:true})})();
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&/^(aNick|aPass)$/.test(e.target.id)){e.preventDefault();submitAuth()}});
$('dView').addEventListener('close',function(){render()});
if(sb)sb.auth.onAuthStateChange(function(ev,sess){
  if(ev==='TOKEN_REFRESHED'){USER=sess?sess.user:USER;return}
  USER=sess?sess.user:null;
  if(ev==='SIGNED_OUT'){DONE={};NOTES={};GOING={};PROFILE={};document.documentElement.removeAttribute('data-fs');OPTS=Object.assign({},DEF_OPTS);try{localStorage.removeItem('uchyoba-opts')}catch(e){}try{localStorage.removeItem('uchyoba-fs')}catch(e){}try{localStorage.removeItem('uchyoba-done')}catch(e){}}
  if(ev==='PASSWORD_RECOVERY')amode='reset';
  setTimeout(function(){afterAuth().then(function(){if(ev==='PASSWORD_RECOVERY')accOpen('reset')})},0);
});
var tg=window.Telegram&&window.Telegram.WebApp;
if(tg&&tg.initData){
  tg.ready();tg.expand();
  if(tg.colorScheme&&!document.documentElement.dataset.theme)document.documentElement.dataset.theme=tg.colorScheme;
  try{tg.setHeaderColor('secondary_bg_color')}catch(e){}
  document.addEventListener('click',function(e){var l=e.target.closest('a[href^="http"]');if(l){e.preventDefault();tg.openLink(l.href)}});
}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(function(){});
refresh();
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!document.querySelector('dialog[open]'))refresh()});
setInterval(function(){if(!document.hidden&&!document.querySelector('dialog[open]'))refresh()},300000);
})();
