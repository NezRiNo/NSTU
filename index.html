function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},3200)}
function pl(n,f){var a=Math.abs(n)%100,b=a%10;return n+' '+(a>10&&a<20?f[2]:b>1&&b<5?f[1]:b==1?f[0]:f[2])}
function sod(d){var x=new Date(d);x.setHours(0,0,0,0);return x}
function pad(n){return String(n).padStart(2,'0')}
function toLocal(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
function subj(id){return S.subjects.find(function(s){return s.id===id})}
function dayDiff(due){return Math.round((sod(due)-sod(new Date()))/864e5)}
function fmtT(d){return pad(d.getHours())+':'+pad(d.getMinutes())}
function dueInfo(t){
  if(!t.due)return {txt:'Без срока',cls:'',g:5};
  var d=new Date(t.due),n=dayDiff(d),dt=d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
  if(t.done)return {txt:dt+', '+fmtT(d),cls:'',g:6};
  if(d<new Date())return {txt:'Просрочено: '+dt+', '+fmtT(d),cls:'bad',g:0};
  if(n===0)return {txt:'Сегодня в '+fmtT(d),cls:'warn',g:1};
  if(n===1)return {txt:'Завтра в '+fmtT(d),cls:'warn',g:2};
  if(n<=7)return {txt:'Через '+pl(n,['день','дня','дней'])+', '+dt,cls:'',g:3};
  return {txt:dt+', '+fmtT(d),cls:'',g:4};
}

  syncTabs();renderCal();renderNav();renderMain();setTC();updInstall();
}

function setTC(){try{var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#f5f4f2'}catch(e){}}
function navCnt(id){var f=function(x){return id==='all'||x.sid===id};return ui.tab==='books'?S.books.filter(f).length:ui.tab==='links'?S.links.filter(f).length:ui.tab==='teachers'?teacherList().filter(function(o){return id==='all'||o.subs[id]}).length:ui.tab==='events'?S.events.filter(f).length:openCnt(id).length}

  }

    kv('Контроль',cur.control)+'</div>'+lessonsH(cur)+(cur.notes?'<div class="notes">'+esc(cur.notes)+'</div>':'')+'</div>';
  }

function kv(k,v){return '<div><small>'+k+'</small>'+(v?esc(v):'<span style="color:var(--mut)">не указано</span>')+'</div>'}
function dueShort(t){
  if(t.done)return {t:'Сдано',p:'var(--ok)'};
  if(!t.due)return {t:'Без срока',p:'var(--mut)'};
  var d=new Date(t.due),n=dayDiff(d);
  if(d<new Date())return {t:'Просрочено',p:'var(--bad)'};
  if(n===0)return {t:'Сегодня, '+fmtT(d),p:'var(--warn)'};
  if(n===1)return {t:'Завтра, '+fmtT(d),p:'var(--warn)'};
  return {t:d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'}).replace('.',''),p:'var(--mut)'};
}
function taskH(t,di){
  var s=subj(t.sid)||{name:'Без дисциплины',color:'#6b7a8f'},th='',fl='',ds=dueShort(t);

    if(f.t.indexOf('image/')===0)th+='<img class="th" data-a="zoom" data-id="'+t.id+'" data-i="'+i+'" src="'+f.d+'" alt="'+esc(f.n)+'">';
    else fl+='<a class="file" href="'+f.d+'" download="'+esc(f.n)+'" data-a="none">'+esc(f.n)+'</a>';
  });
  var badges=pubBadge(t)+(t.prio==='h'?'<span class="pr h">Важно</span>':t.prio==='l'?'<span class="pr">Не срочно</span>':'')+(NOTES[t.id]?'<span class="pr">Заметка</span>':'');

  '<div class="tb" data-a="editTask" data-id="'+t.id+'"><div class="trow"><div class="tt">'+esc(t.title)+'</div><span class="pl" style="--p:'+ds.p+'" title="'+esc(di.txt)+'">'+esc(ds.t)+'</span></div><div class="sb2"><i class="dd8"></i><span>'+esc(s.name)+'</span>'+(t.teacher?'<span>'+esc(t.teacher)+'</span>':'')+badges+'</div>'+(t.desc?'<div class="desc">'+esc(t.desc)+'</div>':'')+((th||fl)?'<div class="thumbs">'+th+fl+'</div>':'')+'</div></div>';

  $('tabT').className=ui.tab==='tasks'?'on':'';$('tabB').className=(ui.tab==='books'||ui.tab==='links')?'on':'';$('tabP').className=ui.tab==='teachers'?'on':'';$('tabE').className=ui.tab==='events'?'on':'';$('nbT').className=ui.tab==='tasks'?'on':'';$('nbB').className=(ui.tab==='books'||ui.tab==='links')?'on':'';$('nbP').className=ui.tab==='teachers'?'on':'';$('nbE').className=ui.tab==='events'?'on':'';
  $('q').placeholder=ui.tab==='books'?'Поиск по литературе: название, автор, дисциплина':ui.tab==='links'?'Поиск по ссылкам':ui.tab==='teachers'?'Поиск по преподавателям':ui.tab==='events'?'Поиск по афише':'Поиск по заданиям и дисциплинам';
}
function bookMatch(b,q){var s=subj(b.sid);return (b.title+' '+b.author+' '+b.kind+' '+(s?s.name:'')).toLowerCase().indexOf(q)>=0}
function renderSearch(){
  var q=ui.q.toLowerCase().trim(),h='';
  var subs=S.subjects.filter(function(s){return hs(s).indexOf(q)>=0});
  var ts=S.tasks.filter(function(t){var s=subj(t.sid);return (t.title+' '+t.desc+' '+(s?hs(s):'')).toLowerCase().indexOf(q)>=0});
  ts.sort(function(a,b){return (a.done-b.done)||((a.due?new Date(a.due):8.6e15)-(b.due?new Date(b.due):8.6e15))});
  var bs=S.books.filter(function(b){return bookMatch(b,q)});
  var ls=S.links.filter(function(l){return linkMatch(l,q)});
  var ps=teacherList().filter(function(o){return teacherMatch(o,q)});
  var es=S.events.filter(function(e){return evMatch(e,q)});
  if(subs.length){h+='<div class="grp">Дисциплины</div>'+subs.map(function(s){return '<button class="nav" style="background:var(--card);border-color:var(--line);margin-bottom:6px" data-a="sub" data-id="'+s.id+'"><span class="dot" style="background:'+s.color+'"></span><span class="nm">'+esc(s.name)+'</span></button>'}).join('')}
  if(ts.length){h+='<div class="grp">Задания</div>'+ts.map(function(t){return taskH(t,dueInfo(t))}).join('')}
  if(bs.length){h+='<div class="grp">Литература</div>'+bs.map(bookH).join('')}
  if(ls.length){h+='<div class="grp">Ссылки</div><div class="lgrid">'+ls.map(linkH).join('')+'</div>'}
  if(es.length){h+='<div class="grp">Афиша</div>'+es.map(evH).join('')}
  if(ps.length){h+='<div class="grp">Преподаватели</div><div class="tgrid">'+ps.map(teacherH).join('')+'</div>'}
  if(!h)h='<div class="empty"><b>Ничего не найдено</b>Попробуйте другое слово: название задания, дисциплины или фамилию преподавателя.</div>';
  $('main').innerHTML=h;
}
function bookH(b){
  var s=subj(b.sid),f=b.file||{};
  return '<div class="book" style="--c:'+(s?s.color:'#8a8f98')+'"><div class="pdf">PDF</div><div class="tb" style="cursor:default"><div class="tt">'+esc(b.title)+'</div><div class="meta">'+(b.author?'<span>'+esc(b.author)+'</span>':'')+'<span class="pr">'+esc(b.kind)+'</span><span class="chip" style="--c:'+(s?s.color:'#8a8f98')+'">'+esc(s?s.name:'Общая')+'</span>'+(f.size?'<span>'+mb(f.size)+'</span>':'')+'</div></div><div class="bact"><a class="btn sm" href="'+esc(f.d)+'" target="_blank" rel="noopener">Открыть</a><a class="btn sm" href="'+esc(f.d)+'?download='+encodeURIComponent(f.n||'book.pdf')+'">Скачать</a><button class="btn sm adm" data-a="editBook" data-id="'+b.id+'">Изменить</button></div></div>';
}
function renderBooks(){
  var cur=ui.sub==='all'?null:subj(ui.sub),q=ui.q.toLowerCase().trim();
  var list=S.books.filter(function(b){return (!cur||b.sid===cur.id)&&(!q||bookMatch(b,q))});
  var h=matSeg()+'<div class="tools"><b>'+(cur?esc(cur.name):'Вся литература')+'</b><span class="sub">'+list.length+' шт.</span><span class="sp"></span><button class="btn pri adm" data-a="newBook">Добавить книгу</button></div>';
  h+=list.length?list.map(bookH).join(''):'<div class="empty"><b>'+(q?'Ничего не найдено':'Литературы пока нет')+'</b>'+(q?'Попробуйте другое слово.':'Здесь будут учебники и методички в PDF.')+'</div>';
  $('main').innerHTML=h;
}
function openBook(id){
  var b=id?S.books.find(function(x){return x.id===id}):null;
  ui.editB=b?b.id:null;bookFile=b?b.file:null;armed=false;
  $('dBookH').textContent=b?'Редактировать книгу':'Новая книга';
  var kinds=['Учебник','Учебное пособие','Методичка','Конспект','Задачник','Другое'];
  $('dBookB').innerHTML='<label>Название<input id="bTitle" placeholder="Например, Сборник задач по математическому анализу" value="'+esc(b?b.title:'')+'"></label><label>Автор<input id="bAuthor" value="'+esc(b?b.author:'')+'"></label>'+
  '<div class="r2"><label>Тип<select id="bKind">'+kinds.map(function(k){return '<option'+(b&&b.kind===k?' selected':'')+'>'+k+'</option>'}).join('')+'</select></label><label>Дисциплина<select id="bSub"><option value="">Общая (без дисциплины)</option>'+S.subjects.map(function(s){return '<option value="'+s.id+'"'+((b?b.sid:(ui.sub!=='all'?ui.sub:''))===s.id?' selected':'')+'>'+esc(s.name)+'</option>'}).join('')+'</select></label></div>'+
  '<div><div class="drop" id="bDrop" data-a="pickBook"></div><input type="file" id="bFile" accept="application/pdf,.pdf" hidden></div>';
  drawBookFile();
  $('dBookF').innerHTML=(b?'<button class="btn dng" data-a="delBook" style="margin-right:auto">Удалить</button>':'')+'<button class="btn" data-a="close" data-t="dBook">Отмена</button><button class="btn pri" data-a="saveBook">Сохранить</button>';
  $('dBook').showModal();
}
function drawBookFile(){$('bDrop').textContent=bookFile?('Файл: '+bookFile.n+(bookFile.size?' ('+mb(bookFile.size)+')':'')+'. Нажмите, чтобы заменить'):'Нажмите, чтобы выбрать PDF (до 50 МБ)'}
async function saveBook(){
  var title=$('bTitle').value.trim();
  if(!title){$('bTitle').focus();toast('Введите название');return}
  if(!bookFile){toast('Выберите PDF-файл');return}
  var btn=document.querySelector('[data-a="saveBook"]');btn.disabled=true;btn.textContent='Загружаю…';
  try{
    var bk=sb.storage.from('homework'),file=bookFile,old=ui.editB?S.books.find(function(x){return x.id===ui.editB}):null;
    if(bookFile.raw){
      var p='books/'+uid()+uid()+'.pdf';
      var up=await bk.upload(p,bookFile.raw,{contentType:'application/pdf',cacheControl:'31536000'});
      if(up.error)throw up.error;
      file={n:bookFile.n,t:'application/pdf',size:bookFile.size,d:bk.getPublicUrl(p).data.publicUrl,p:p};
    }
    var row={title:title,author:$('bAuthor').value.trim(),kind:$('bKind').value,subject_id:$('bSub').value||null,file:file};
    var r=ui.editB?await sb.from('books').update(row).eq('id',ui.editB):await sb.from('books').insert(row);
    if(r.error)throw r.error;
    if(old&&old.file&&old.file.p&&old.file.p!==file.p)await bk.remove([old.file.p]);
    $('dBook').close();await load();render();toast('Сохранено');
  }catch(e){toast('Ошибка: '+(e.message||e))}
  btn.disabled=false;btn.textContent='Сохранить';
}
async function delBook(el){
  if(!armed){armed=true;el.textContent='Точно удалить?';return}
  armed=false;
  try{
    var b=S.books.find(function(x){return x.id===ui.editB});
    var r=await sb.from('books').delete().eq('id',ui.editB);if(r.error)throw r.error;
    if(b&&b.file&&b.file.p)await sb.storage.from('homework').remove([b.file.p]);
    $('dBook').close();await load();render();
  }catch(e){toast('Ошибка: '+(e.message||e))}
}
function drawLes(){

    '<div class="lg" style="grid-template-columns:1fr 1fr"><label>Преподаватель<input data-l="teacher"'+d+' value="'+esc(l.teacher)+'" placeholder="Фамилия И. О. (несколько: через запятую)"></label><label>Аудитория<input data-l="room"'+d+' value="'+esc(l.room)+'" placeholder="Например, 3-405"></label></div><button class="btn sm dng" data-a="rmLes"'+d+' style="justify-self:end">Убрать занятие</button></div>';

/* ---------- календарь ---------- */
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function renderCal(){
  var mob=matchMedia('(max-width:820px)').matches;
  var open=ui.calOpen===undefined?!mob:ui.calOpen,week=!open,now=new Date();
  if(!ui.cal)ui.cal=new Date(now.getFullYear(),now.getMonth(),1);
  var days=[],title,curMo=ui.cal.getMonth();
  if(week){
    var t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()+(ui.wk||0)*7),b=new Date(t0.getFullYear(),t0.getMonth(),t0.getDate()-(t0.getDay()+6)%7);
    for(var i=0;i<7;i++)days.push(new Date(b.getFullYear(),b.getMonth(),b.getDate()+i));
    title=days[3];
  }else{
    var m=ui.cal,y=m.getFullYear(),mo=m.getMonth(),off=(new Date(y,mo,1).getDay()+6)%7;
    for(var j=0;j<42;j++){var d0=new Date(y,mo,1-off+j);if(j>=35&&d0.getMonth()!==mo)break;days.push(d0)}
    title=m;
  }
  var cur=ui.sub==='all'?null:subj(ui.sub),by={};
  S.tasks.forEach(function(t){if(!t.due||(cur&&t.sid!==cur.id))return;var k=t.due.slice(0,10);(by[k]=by[k]||[]).push(t)});
  var evBy={};S.events.forEach(function(e){if(!e.start||(cur&&e.sid&&e.sid!==cur.id))return;var k=e.start.slice(0,10);(evBy[k]=evBy[k]||[]).push(e)});
  var td=ymd(now),nav=week?'cwk':'cmo';
  var h='<div class="calw"><div class="ch"><button data-a="'+nav+'" data-id="-1" aria-label="Назад">‹</button><button class="ct" data-a="ctog" aria-expanded="'+open+'">'+title.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})+' '+(open?'▴':'▾')+'</button><button data-a="'+nav+'" data-id="1" aria-label="Вперёд">›</button></div><div class="cg">'+DAYS.map(function(d){return '<div class="wd">'+d+'</div>'}).join('');
  days.forEach(function(d){
    var k=ymd(d),L=(by[k]||[]).slice().sort(function(a,b){return a.done-b.done}).slice(0,4);
    var dots=L.map(function(t){var s=subj(t.sid);return '<i style="--c:'+(s?s.color:'#8a8f98')+(t.done?';opacity:.35':'')+'"></i>'}).join('')+(evBy[k]||[]).slice(0,2).map(function(e){return '<i class="rg" style="--c:'+(EK[e.kind]||EK['Другое'])+'"></i>'}).join('');
    var cnt=(by[k]||[]).length;
    h+='<button class="cd'+(!week&&d.getMonth()!==curMo?' o':'')+(k===td?' t':'')+(k===ui.day?' s':'')+'" data-a="day" data-id="'+k+'" aria-label="'+d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})+(cnt?', заданий: '+cnt:'')+((evBy[k]||[]).length?', событий: '+evBy[k].length:'')+'"><span class="n">'+d.getDate()+'</span><span class="dots">'+dots+'</span></button>';
  });
  h+='</div>'+((open||ui.wk)?'<button class="btn sm" data-a="ctoday" style="width:100%;margin-top:8px">Сегодня</button>':'')+'</div>';
  $('cal').innerHTML=h;
}
function renderDay(){
  var cur=ui.sub==='all'?null:subj(ui.sub),d=new Date(ui.day+'T00:00'),wd=(d.getDay()+6)%7;
  var list=S.tasks.filter(function(t){return t.due&&t.due.slice(0,10)===ui.day&&(!cur||t.sid===cur.id)}).sort(function(a,b){return new Date(a.due)-new Date(b.due)});
  var h='<div class="tools"><b>'+d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})+'</b><span class="sp"></span><button class="btn sm" data-a="dayoff">Показать все задания</button></div>';
  h+='<div class="grp">Дедлайны</div>'+(list.length?list.map(function(t){return taskH(t,dueInfo(t))}).join(''):'<div class="empty"><b>На этот день заданий нет</b>Выберите другой день в календаре.</div>');
  var evd=S.events.filter(function(e){return e.start&&e.start.slice(0,10)===ui.day&&(!cur||!e.sid||e.sid===cur.id)});
  if(evd.length)h+='<div class="grp">События</div>'+evd.map(evH).join('');
  var ls=[];
  S.subjects.forEach(function(s){if(cur&&s.id!==cur.id)return;(s.lessons||[]).forEach(function(l){if(+l.day===wd)ls.push({s:s,l:l})})});
  ls.sort(function(a,b){return String(a.l.from).localeCompare(String(b.l.from))});
  if(ls.length)h+='<div class="grp">Занятия в этот день недели</div>'+ls.map(function(x){var l=x.l;return '<div class="task" style="--c:'+x.s.color+'"><div class="tb" style="cursor:default"><div class="tt">'+esc(l.type)+': '+esc(x.s.name)+'</div><div class="meta"><span>'+esc(l.from)+(l.to?'–'+esc(l.to):'')+'</span>'+(l.week&&l.week!=='all'?'<span class="pr">'+WEEKS[l.week]+' неделя</span>':'')+(l.teacher?'<span>'+esc(l.teacher)+'</span>':'')+(l.room?'<span>ауд. '+esc(l.room)+'</span>':'')+'</div></div></div>'}).join('');
  $('main').innerHTML=h;
}

/* ---------- ссылки ---------- */
function normUrl(u){
  u=String(u||'').trim();if(!u)return null;
  if(/^(javascript|data|vbscript|file|blob):/i.test(u))return null;
  if(!/^https?:\/\//i.test(u))u='https://'+u;
  try{new URL(u)}catch(e){return null}
  return u;
}
function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}}
function linkMatch(l,q){var s=subj(l.sid);return (l.title+' '+l.desc+' '+l.cat+' '+host(l.url)+' '+(s?s.name:'')).toLowerCase().indexOf(q)>=0}
function linkH(l){
  var s=subj(l.sid);
  return '<div class="lk" style="--c:'+(s?s.color:'#8a8f98')+'"><a class="lkm" href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer"><div class="lic">'+esc((l.title||'?').trim().charAt(0).toUpperCase())+'</div><div style="min-width:0"><div class="lt">'+esc(l.title)+'</div><div class="ld">'+esc(host(l.url))+'</div>'+(l.desc?'<div class="ld" style="margin-top:4px;color:var(--ink)">'+esc(l.desc)+'</div>':'')+(s?'<div style="margin-top:6px"><span class="chip">'+esc(s.name)+'</span></div>':'')+'</div></a><button class="btn sm adm" data-a="editLink" data-id="'+l.id+'">Изменить</button></div>';
}
function renderLinks(){
  var cur=ui.sub==='all'?null:subj(ui.sub),q=ui.q.toLowerCase().trim();
  var list=S.links.filter(function(l){return (!cur||l.sid===cur.id||!l.sid)&&(!q||linkMatch(l,q))});
  var h=matSeg()+'<div class="tools"><b>'+(cur?esc(cur.name):'Все ссылки')+'</b><span class="sub">'+list.length+' шт.</span><span class="sp"></span><button class="btn pri adm" data-a="newLink">Добавить ссылку</button></div>';
  if(!list.length){$('main').innerHTML=h+'<div class="empty"><b>'+(q?'Ничего не найдено':'Ссылок пока нет')+'</b>'+(q?'Попробуйте другое слово.':'Здесь будут полезные ресурсы: расписание, библиотека, курсы, чаты.')+'</div>';return}
  var g={},order=[];
  list.forEach(function(l){var k=l.cat||'Прочее';if(!g[k]){g[k]=[];order.push(k)}g[k].push(l)});
  order.sort(function(a,b){return a==='Прочее'?1:b==='Прочее'?-1:a.localeCompare(b,'ru')});
  order.forEach(function(k){h+='<div class="grp">'+esc(k)+'</div><div class="lgrid">'+g[k].map(linkH).join('')+'</div>'});
  $('main').innerHTML=h;
}
function openLink(id){
  var l=id?S.links.find(function(x){return x.id===id}):null;
  ui.editL=l?l.id:null;armed=false;
  var cats=['Расписание','Библиотека','Курсы и материалы','Сервисы университета','Чаты и сообщества'];
  S.links.forEach(function(x){if(x.cat&&cats.indexOf(x.cat)<0)cats.push(x.cat)});

  $('dLinkB').innerHTML='<label>Название<input id="lTitle" placeholder="Например, Расписание занятий" value="'+esc(l?l.title:'')+'"></label><label>Адрес<input id="lUrl" type="url" inputmode="url" placeholder="https://" value="'+esc(l?l.url:'')+'"></label>'+
  '<div class="r2"><label>Категория<input id="lCat" list="lcats" placeholder="Например, Библиотека" value="'+esc(l?l.cat:'')+'"><datalist id="lcats">'+cats.map(function(c){return '<option>'+esc(c)+'</option>'}).join('')+'</datalist></label><label>Дисциплина<select id="lSub"><option value="">Для всех</option>'+S.subjects.map(function(s){return '<option value="'+s.id+'"'+((l?l.sid:(ui.sub!=='all'?ui.sub:''))===s.id?' selected':'')+'>'+esc(s.name)+'</option>'}).join('')+'</select></label></div>'+
  '<label>Описание<textarea id="lDesc" style="min-height:60px" placeholder="Коротко, для чего эта ссылка">'+esc(l?l.desc:'')+'</textarea></label>';
  $('dLinkF').innerHTML=(l?'<button class="btn dng" data-a="delLink" style="margin-right:auto">Удалить</button>':'')+'<button class="btn" data-a="close" data-t="dLink">Отмена</button><button class="btn pri" data-a="saveLink">Сохранить</button>';
  $('dLink').showModal();

async function saveLink(){
  var title=$('lTitle').value.trim(),url=normUrl($('lUrl').value);
  if(!title){$('lTitle').focus();toast('Введите название');return}
  if(!url){$('lUrl').focus();toast('Проверьте адрес ссылки');return}
  var row={title:title,url:url,category:$('lCat').value.trim(),subject_id:$('lSub').value||null,descr:$('lDesc').value.trim()};
  try{
    var r=ui.editL?await sb.from('links').update(row).eq('id',ui.editL):await sb.from('links').insert(row);
    if(r.error)throw r.error;
    $('dLink').close();await load();render();toast('Сохранено');
  }catch(e){toast('Ошибка: '+(e.message||e))}
}
async function delLink(el){
  if(!armed){armed=true;el.textContent='Точно удалить?';return}
  armed=false;
  try{var r=await sb.from('links').delete().eq('id',ui.editL);if(r.error)throw r.error;$('dLink').close();await load();render()}
  catch(e){toast('Ошибка: '+(e.message||e))}
}

/* ---------- преподаватели ---------- */
function nk(n){return String(n).toLowerCase().replace(/[.,]/g,' ').replace(/\s+/g,' ').trim()}
function teacherList(){
  var map={};
  S.subjects.forEach(function(s){(s.lessons||[]).forEach(function(l){
    String(l.teacher||'').split(/[;,\/]+/).forEach(function(nm){
      nm=nm.trim();if(!nm)return;var k=nk(nm);
      var o=map[k]||(map[k]={name:nm,subs:{},rec:null});
      var x=o.subs[s.id]||(o.subs[s.id]={s:s,types:[]});
      if(x.types.indexOf(l.type)<0)x.types.push(l.type);
    });
  })});
  S.teachers.forEach(function(r){var k=nk(r.name);var o=map[k]||(map[k]={name:r.name,subs:{},rec:null});o.rec=r;o.name=r.name;(r.subject_ids||[]).forEach(function(sid){var sb2=subj(sid);if(sb2&&!o.subs[sid])o.subs[sid]={s:sb2,types:[]}})});
  return Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return a.name.localeCompare(b.name,'ru')});
}
function teacherMatch(o,q){var r=o.rec||{};return (o.name+' '+(r.dept||'')+' '+(r.email||'')+' '+(r.room||'')+' '+(r.consult||'')+' '+(r.notes||'')+' '+JSON.stringify(r.consults||[])+' '+Object.keys(o.subs).map(function(k){return o.subs[k].s.name}).join(' ')).toLowerCase().indexOf(q)>=0}
function teacherH(o){

function weeksTxt(str){
  var n=(String(str||'').match(/\d+/g)||[]);if(!n.length)return '';
  var a=n.map(function(x){return x+'-я'});
  if(a.length===1)return a[0]+' неделя';
  return a.slice(0,-1).join(', ')+' и '+a[a.length-1]+' недели';
}
function consBlock(r){

async function doBackup(){
  aerr('');amsgs('');
  try{
    var out={app:'neti-planner',version:1,exported_at:new Date().toISOString(),tables:{}},n=0;
    for(var i=0;i<BK_TABLES.length;i++){
      var r=await sb.from(BK_TABLES[i]).select('*');
      if(r.error){if(/does not exist|relation|schema cache/i.test(r.error.message))continue;throw r.error}
      out.tables[BK_TABLES[i]]=r.data;n+=r.data.length;
    }
    var u=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'})),a=document.createElement('a');
    a.href=u;a.download='neti-backup-'+ymd(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1500);
    amsgs('Копия скачана, записей: '+n);
  }catch(e){aerr('Ошибка: '+(e.message||e))}
}
async function doRestore(){
  aerr('');amsgs('Восстанавливаю…');
  try{
    for(var i=0;i<BK_TABLES.length;i++){
      var t=BK_TABLES[i],rows=ui.bk[t];if(!rows||!rows.length)continue;
      for(var j=0;j<rows.length;j+=100){var r=await sb.from(t).upsert(rows.slice(j,j+100));if(r.error)throw r.error}
    }
    ui.bk=null;await load();render();drawAcc();amsgs('Готово: данные восстановлены.');
  }catch(e){aerr('Ошибка: '+(e.message||e));amsgs('')}
}

function myStats(){
  var now=new Date(),r={a:0,o:0,w:0,d:0,all:S.tasks.filter(isLive).length};
  S.tasks.forEach(function(t){
    if(!isLive(t))return;
    if(t.done){r.d++;return}
    r.a++;
    if(t.due){var dd=new Date(t.due);if(dd<now)r.o++;else if(dayDiff(dd)<=7)r.w++}
  });
  return r;
}
function soonList(){
  var now=new Date(),it=[];
  S.tasks.forEach(function(t){
    if(!isLive(t)||t.done||!t.due)return;var d=new Date(t.due);
    if(d>now&&dayDiff(d)>7)return;
    var di=dueInfo(t),s=subj(t.sid);
    it.push({k:'task',id:t.id,when:d,title:t.title,label:(s?s.name+': ':'')+di.txt,cls:di.cls,c:s?s.color:'#8a8f98'});
  });
  S.events.forEach(function(e){
    if(!GOING[e.id]||evPast(e)||!isLive(e))return;
    var col=EK[e.kind]||EK['Другое'];
    if(e.start&&dayDiff(new Date(e.start))<=14)it.push({k:'ev',id:e.id,when:new Date(e.start),title:e.title,label:'Иду: '+fdt(e.start)+' ('+evRel(e.start)+')',cls:'',c:col});
    var ri=regInfo(e);
    if(ri&&!ri.closed)it.push({k:'ev',id:e.id,when:new Date(e.regDeadline),title:'Регистрация: '+e.title,label:ri.t,cls:ri.cls,c:col});
  });
  it.sort(function(a,b){return a.when-b.when});
  return it.slice(0,10);
}

function icsEsc(t){return String(t||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n')}
function icsDT(str){return str.replace(/[-:]/g,'')+'00'}
function icsEvent(uid2,title,startStr,mins,place,desc,alarms){
  var d=new Date(startStr);d.setMinutes(d.getMinutes()+mins);
  var l=['BEGIN:VEVENT','UID:'+uid2+'@neti-group','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z','DTSTART:'+icsDT(startStr),'DTEND:'+icsDT(toLocal(d)),'SUMMARY:'+icsEsc(title)];
  if(place)l.push('LOCATION:'+icsEsc(place));
  if(desc)l.push('DESCRIPTION:'+icsEsc(desc));
  alarms.forEach(function(a){l.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(title),'TRIGGER:'+a,'END:VALARM')});
  l.push('END:VEVENT');return l;
}
function evIcs(e){

  if(e.regDeadline&&new Date(e.regDeadline)>new Date())l=l.concat(icsEvent(e.id+'-reg','Регистрация: '+e.title,e.regDeadline,30,'',e.regUrl||'',['-P1D','-PT3H']));

(function(){

  function end(e){
    if(!dlg)return;
    var dy=(e.changedTouches&&e.changedTouches[0]?e.changedTouches[0].clientY:sy)-sy,d=dlg;dlg=null;sy=null;
    d.style.transition='transform .2s';

})();

function drawAtt(){
  $('tAtt').innerHTML=files.map(function(f,i){
    return '<div>'+(f.t.indexOf('image/')===0?'<img class="th" data-a="zoomF" data-i="'+i+'" src="'+f.d+'" alt="'+esc(f.n)+'">':'<span class="file">'+esc(f.n)+'</span>')+'<button class="x" data-a="rmF" data-i="'+i+'" aria-label="Убрать вложение">×</button></div>';
  }).join('');
}
function comp(f){
  return new Promise(function(res){
    if(f.type.indexOf('image/')!==0){
      if(f.size>1.5e6){toast('Файл «'+f.name+'» больше 1,5 МБ, он не добавлен');return res(null)}
      var r=new FileReader();r.onload=function(){res({n:f.name,t:f.type||'application/octet-stream',d:r.result})};r.onerror=function(){res(null)};r.readAsDataURL(f);return;
    }
    var im=new Image(),u=URL.createObjectURL(f);
    im.onload=function(){
      var m=1100,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(u);res({n:f.name||'фото.jpg',t:'image/jpeg',d:c.toDataURL('image/jpeg',.72)});
    };
    im.onerror=function(){toast('Не удалось открыть «'+f.name+'». Попробуйте JPG или PNG.');res(null)};
    im.src=u;
  });
}
function addFiles(list){
  if(!$('dTask').open)return;
  Promise.all(Array.prototype.map.call(list,comp)).then(function(r){
    r.forEach(function(x){if(x)files.push(x)});drawAtt();
  });
}
async function saveTask(){
  var title=$('tTitle').value.trim();
  if(!title){$('tTitle').focus();toast('Введите название задания');return}
  var pv=pubVals('t');if(pv.bad){toast('Укажите дату публикации');return}
  var btn=document.querySelector('[data-a="saveTask"]');btn.disabled=true;btn.textContent='Сохраняю…';
  try{
    var out=[],bk=sb.storage.from('homework');
    for(var i=0;i<files.length;i++){
      var f=files[i];
      if(f.d.indexOf('data:')===0){
        var blob=await (await fetch(f.d)).blob();
        var ext=(f.n.split('.').pop()||'bin').replace(/[^a-z0-9]/gi,'').slice(0,5)||'bin';
        var p=uid()+uid()+'.'+ext;
        var up=await bk.upload(p,blob,{contentType:f.t,cacheControl:'31536000'});
        if(up.error)throw up.error;
        out.push({n:f.n,t:f.t,d:bk.getPublicUrl(p).data.publicUrl,p:p});
      }else out.push(f);
    }
    var old=ui.editT?S.tasks.find(function(x){return x.id===ui.editT}):null;
    var due=$('tDue').value;
    var row={subject_id:$('tSub').value,title:title,descr:$('tDesc').value.trim(),due:due?new Date(due).toISOString():null,prio:$('tPrio').value,teacher:$('tTeach').value,draft:pv.draft,publish_at:pv.publish_at,files:out};
    var r=ui.editT?await sb.from('tasks').update(row).eq('id',ui.editT):await sb.from('tasks').insert(row);
    if(r.error)throw r.error;
    if(old){var keep=out.map(function(x){return x.p});var rm=(old.files||[]).map(function(x){return x.p}).filter(function(p){return p&&keep.indexOf(p)<0});if(rm.length)await bk.remove(rm)}
    $('dTask').close();await load();render();toast('Сохранено');
  }catch(e){toast('Ошибка: '+(e.message||e))}
  btn.disabled=false;btn.textContent='Сохранить';
}

function mapErr(m){
  m=String(m||'');
  if(/invalid login/i.test(m))return 'Неверный ник или пароль';
  if(/already|registered/i.test(m))return 'Этот ник уже занят';
  if(/rate|limit|too many/i.test(m))return 'Слишком много попыток, попробуйте чуть позже.';
  if(/fetch|network/i.test(m))return 'Нет связи с сервером. Откройте сайт по обычной ссылке.';
  if(/email/i.test(m)&&/invalid/i.test(m))return 'Сервер не принял служебный адрес. Сообщите администратору.';
  if(/password/i.test(m)&&/short|least|weak/i.test(m))return 'Пароль слишком простой или короткий.';
  return m;
}

  if(r.error){MERGE=false;aerr(mapErr(r.error.message));return}
  $('dData').close();

async function doUp(){
  aerr('');amsgs('');var v=$('aNick').value.trim(),pw=$('aPass').value;
  if(!/^[a-z0-9_-]{3,20}$/i.test(v)){aerr('Ник: 3–20 символов, латиница, цифры, _ и -');return}
  if(pw.length<8){aerr('Пароль должен быть не короче 8 символов');return}
  MERGE=true;
  var r=await sb.auth.signUp({email:toEmail(v),password:pw});
  if(r.error){MERGE=false;aerr(mapErr(r.error.message));return}
  if(r.data&&r.data.session){$('dData').close();return}
  MERGE=false;aerr('В Supabase включено подтверждение почты. Его нужно выключить: Authentication, Sign In / Providers, Email.');

async function pushState(){
  if(!USER||!sb)return;
  var row={user_id:USER.id,done:DONE,notes:NOTES,going:GOING,profile:PROFILE,updated_at:new Date().toISOString()};
  var c=USER.user_metadata&&USER.user_metadata.consent_at;if(c)row.consent_at=c;
  var r=await sb.from('user_state').upsert(row);
  if(r.error&&/going|profile|column/i.test(r.error.message||'')){delete row.going;delete row.profile;r=await sb.from('user_state').upsert(row)}
  if(r.error)toast('Не удалось сохранить в кабинете');
}
async function loadMine(){
  if(!USER||!sb)return;
  var r=await sb.from('user_state').select('done,notes,going,profile').eq('user_id',USER.id).maybeSingle();
  if(r.error){r=await sb.from('user_state').select('done,notes').eq('user_id',USER.id).maybeSingle();if(r.error)return}
  var srv=(r.data&&r.data.done)||{};
  if(MERGE){DONE=Object.assign({},DONE,srv);try{localStorage.removeItem('uchyoba-done')}catch(e){}MERGE=false}
  else DONE=Object.assign({},srv);
  NOTES=(r.data&&r.data.notes)||{};
  GOING=(r.data&&r.data.going)||{};PROFILE=(r.data&&r.data.profile)||{};
  if(!r.data||Object.keys(DONE).length!==Object.keys(srv).length)pushState();
}
